apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsvp-core
  labels:
    app: rsvp-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rsvp-core
  template:
    metadata:
      labels:
        app: rsvp-core
    spec:
      containers:
      - name: rsvp-core
        image: eventflow/rsvp-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50051
          name: grpc
        env:
        - name: PORT
          value: "8080"
        - name: GRPC_PORT
          value: "50051"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eventflow-secrets
              key: database-url
        - name: VALKEY_ADDR
          value: "valkey-cluster:6379"
        - name: NATS_URL
          value: "nats://nats:4222"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rsvp-core
spec:
  selector:
    app: rsvp-core
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rsvp-core-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rsvp-core
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
